name: Launcher tests
on:
  push:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dependencies.lock.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned backend
        run: node --input-type=module -e "import {setup} from './scripts/setup.js'; await setup({withGame:false});"
      - run: npm test
